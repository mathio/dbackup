<!DOCTYPE html>
<html lang="en" data-accent="{{theme}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <div class="login-mark">
          <svg class="icon-stroke" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
        </div>
        <h1>{{title}}</h1>
        <div class="sub">Sign in to manage database backups</div>
        <form action="" method="post">
          <div class="field{{#if wrongPassword}} has-error{{/if}}">
            <label for="pwd">Password</label>
            <input
              id="pwd"
              name="pwd"
              type="password"
              placeholder="••••••••••"
              autofocus
            />
            {{#if wrongPassword}}
            <div class="field-error">
              <svg class="icon-stroke" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 9v5M12 17h.01"/></svg>
              Incorrect password. Try again.
            </div>
            {{/if}}
          </div>
          <button class="btn btn-primary" type="submit">
            <svg class="icon-stroke" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            Sign in
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
